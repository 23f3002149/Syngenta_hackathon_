services:
  - type: web
    name: krishiconnect-backend
    env: python
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_ACCOUNTS
        sync: false
      - key: TEST_NUMBERS
        sync: false
      - key: DEMO_RETAILER_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PIPELINE_CACHE_HOURS
        sync: false
